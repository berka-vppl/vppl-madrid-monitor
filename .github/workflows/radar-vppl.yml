name: Radar VPP Madrid

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  ejecutar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recuperar base de datos
        uses: actions/cache@v6
        with:
          path: database
          key: vpp-database-${{ github.run_id }}
          restore-keys: |
            vpp-database-
            vppl-database-

      - name: Ejecutar tests
        run: python -m pytest

      - name: Ejecutar Radar VPP Madrid
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.monitor
